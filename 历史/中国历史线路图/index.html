    <footer>年代边界与上古纪年存在不同学术口径；本图以通行断代为骨架，便于建立整体历史坐标。</footer>

    <script>
      const groups = [
        {
          label: "文明起源", years: "远古—约前2070", rows: [
            [{ id: "paleolithic", name: "旧石器时代", years: "约200万年前—约前10000", span: 12, kind: "transition", summary: "早期人类在中国大地活动，经历漫长的采集、狩猎与石器技术发展。", tags: ["早期人类", "打制石器", "采集狩猎"] }],
            [{ id: "neolithic", name: "新石器时代", years: "约前10000—约前2000", span: 12, kind: "parallel", summary: "农业、聚落与陶器逐渐发展，各区域文化相互交流，复杂社会开始形成。", tags: ["农业起源", "定居聚落", "多元一体"] }]
          ]
        },
        {
          label: "夏商周", years: "约前2070—前256", rows: [
            [{ id: "xia", name: "夏", years: "约前2070—约前1600", span: 12, summary: "传统文献所记的早期王朝。其年代、疆域与考古文化对应关系仍在持续研究。", tags: ["早期国家", "二里头文化", "世袭传统"] }],
            [{ id: "shang", name: "商", years: "约前1600—前1046", span: 12, summary: "以甲骨文、青铜礼器和成熟的王权体系著称，留下了可与文献相互印证的文字材料。", tags: ["甲骨文", "青铜文明", "殷墟"] }],
            [{ id: "western-zhou", name: "西周", years: "前1046—前771", span: 12, summary: "周人建立分封与宗法秩序，礼乐制度成为后世政治文化的重要源头。", tags: ["分封制", "宗法制", "礼乐"] }],
            [{ id: "spring-autumn", name: "春秋", years: "前770—前476", span: 6, kind: "transition", summary: "周王室权威下降，诸侯争霸；社会结构变化促成思想与制度的新发展。", tags: ["诸侯争霸", "礼崩乐坏", "孔子"] }, { id: "warring-states", name: "战国", years: "前475—前221", start: 7, span: 6, kind: "transition", summary: "七雄竞争推动变法、军政与官僚制度革新，百家争鸣塑造中国思想传统。", tags: ["战国七雄", "变法", "百家争鸣"] }]
          ]
        },
        {
          label: "秦汉", years: "前221—220", rows: [
            [{ id: "qin", name: "秦", years: "前221—前207", span: 12, featured: true, summary: "秦完成大一统，建立皇帝制度与中央集权官僚体系，并推行文字、度量衡等统一。", tags: ["大一统", "郡县制", "书同文"] }],
            [{ id: "western-han", name: "西汉", years: "前202—9", span: 7, summary: "汉初休养生息，汉武帝时期加强中央权力并开拓交通，统一帝国框架趋于稳固。", tags: ["文景之治", "汉武帝", "丝绸之路"] }, { id: "xin", name: "新", years: "9—23", start: 8, span: 2, kind: "transition", summary: "王莽建立的新朝进行大规模制度改革，但因社会矛盾与治理危机迅速覆亡。", tags: ["王莽", "改制", "新末动荡"] }, { id: "eastern-han", name: "东汉", years: "25—220", start: 10, span: 3, summary: "刘秀重建汉室。后期外戚、宦官与地方势力交织，最终走向群雄割据。", tags: ["光武中兴", "豪强", "党锢之祸"] }]
          ]
        },
        {
          label: "魏晋", years: "220—420", rows: [
            [{ id: "wei", name: "曹魏", years: "220—266", span: 4, kind: "parallel", summary: "曹魏控制北方核心地区，九品中正制等制度对魏晋政治影响深远。", tags: ["曹丕", "九品中正", "北方"] }, { id: "shu", name: "蜀汉", years: "221—263", start: 5, span: 4, kind: "parallel", summary: "刘备在成都称帝，以继承汉统自居，诸葛亮执政与北伐最具代表性。", tags: ["刘备", "诸葛亮", "益州"] }, { id: "wu", name: "孙吴", years: "229—280", start: 9, span: 4, kind: "parallel", summary: "孙吴立足江东，发展长江中下游，并推动南方经济与海上交通。", tags: ["孙权", "江东", "南方开发"] }],
            [{ id: "western-jin", name: "西晋", years: "266—316", span: 12, summary: "西晋短暂统一三国，但宗室内乱和北方动荡使统一迅速瓦解。", tags: ["三国归晋", "八王之乱", "永嘉之乱"] }],
            [{ id: "eastern-jin", name: "东晋", years: "317—420", span: 6, kind: "parallel", summary: "晋室南渡后以建康为中心维持政权，门阀政治与江南开发是时代特征。", tags: ["衣冠南渡", "门阀政治", "江南开发"] }, { id: "sixteen", name: "十六国", years: "304—439", start: 7, span: 6, kind: "parallel", summary: "北方多个政权先后并立，战争、迁徙与民族互动共同改变社会结构。", tags: ["政权并立", "人口迁徙", "民族交融"] }]
          ]
        },
        {
          label: "南北朝", years: "420—589", rows: [
            [{ id: "liu-song", name: "刘宋", years: "420—479", span: 3, kind: "parallel", summary: "南朝第一个政权，承接东晋，以建康为都。", tags: ["南朝", "建康", "寒门上升"] }, { id: "southern-qi", name: "南齐", years: "479—502", start: 4, span: 3, kind: "parallel", summary: "萧道成代宋建齐，政权延续时间较短。", tags: ["南朝", "萧氏", "建康"] }, { id: "liang", name: "梁", years: "502—557", start: 7, span: 3, kind: "parallel", summary: "梁武帝时期文化繁盛，侯景之乱重创江南政治秩序。", tags: ["梁武帝", "侯景之乱", "佛教"] }, { id: "chen", name: "陈", years: "557—589", start: 10, span: 3, kind: "parallel", summary: "南朝最后一个政权，589年为隋所灭。", tags: ["南朝", "陈霸先", "隋灭陈"] }],
            [{ id: "northern-wei", name: "北魏", years: "386—534", span: 6, kind: "parallel", summary: "北魏统一北方，孝文帝改革与迁都洛阳推动制度转型和民族交融。", tags: ["统一北方", "孝文帝改革", "洛阳"] }, { id: "east-west-wei", name: "东魏 · 西魏", years: "534—557", start: 7, span: 3, kind: "parallel", summary: "北魏分裂为东魏与西魏，两者分别孕育北齐与北周。", tags: ["北魏分裂", "高欢", "宇文泰"] }, { id: "qi-zhou", name: "北齐 · 北周", years: "550—581", start: 10, span: 3, kind: "parallel", summary: "北周最终灭北齐统一北方，为隋朝重新统一奠定基础。", tags: ["北齐", "北周", "北方统一"] }]
          ]
        },
        {
          label: "隋唐", years: "581—907", rows: [
            [{ id: "sui", name: "隋", years: "581—618", span: 12, featured: true, summary: "隋结束长期南北分裂，重建统一秩序，并开凿大运河、发展科举。", tags: ["再统一", "大运河", "科举"] }],
            [{ id: "tang", name: "唐", years: "618—907", span: 12, summary: "唐前期政治开放、国力强盛、交流广泛；安史之乱后藩镇与财政结构发生深刻变化。", tags: ["贞观之治", "长安", "安史之乱"] }],
            [{ id: "wu-zhou", name: "武周", years: "690—705（唐代中断期）", start: 4, span: 6, kind: "transition", summary: "武则天改国号为周，是唐代政治进程中的一次中断与重组。", tags: ["武则天", "神都洛阳", "科举发展"] }]
          ]
        },
        {
          label: "五代宋元", years: "907—1368", rows: [
            [{ id: "five", name: "五代", years: "907—960", span: 6, kind: "transition", summary: "中原先后经历后梁、后唐、后晋、后汉、后周五个短期政权。", tags: ["中原更替", "藩镇", "后周改革"] }, { id: "ten", name: "十国", years: "约902—979", start: 7, span: 6, kind: "parallel", summary: "南方及北方部分地区多个政权并立，区域经济文化继续发展。", tags: ["割据", "南方经济", "区域政权"] }],
            [{ id: "north-song", name: "北宋", years: "960—1127", span: 5, summary: "宋强化文官政治与中央集权，商品经济、城市文化和技术高度发展。", tags: ["文官政治", "汴京", "商业繁荣"] }, { id: "liao", name: "辽", years: "916—1125", start: 6, span: 3, kind: "parallel", summary: "契丹建立的辽朝与北宋长期并立，以南北面官制度治理不同区域。", tags: ["契丹", "南北面官", "澶渊之盟"] }, { id: "western-xia", name: "西夏", years: "1038—1227", start: 9, span: 4, kind: "parallel", summary: "党项建立的政权，形成独特文字与制度，长期处于宋、辽、金之间。", tags: ["党项", "西夏文", "河西"] }],
            [{ id: "south-song", name: "南宋", years: "1127—1279", span: 5, kind: "parallel", summary: "宋室南渡后以临安为中心，经济与海上贸易继续发展。", tags: ["临安", "海上贸易", "岳飞"] }, { id: "jin", name: "金", years: "1115—1234", start: 6, span: 4, kind: "parallel", summary: "女真建立金朝，灭辽和北宋，统治中国北方并推动制度融合。", tags: ["女真", "猛安谋克", "宋金对峙"] }, { id: "west-liao", name: "西辽", years: "1124—1218", start: 10, span: 3, kind: "parallel", summary: "辽宗室西迁中亚后建立的政权，延续部分辽朝制度与文化。", tags: ["耶律大石", "中亚", "契丹"] }],
            [{ id: "mongol-yuan", name: "蒙古国 · 元", years: "1206—1368", span: 12, featured: true, summary: "蒙古兴起并建立元朝，重新统一中国，形成横跨欧亚的交通与交流网络。", tags: ["成吉思汗", "大一统", "行省制"] }]
          ]
        },
        {
          label: "明清", years: "1368—1912", rows: [
            [{ id: "ming", name: "明", years: "1368—1644", span: 8, featured: true, summary: "明重建汉地王朝秩序，强化中央集权；中后期商品经济、白银流通与海内外交流显著发展。", tags: ["洪武建国", "郑和下西洋", "晚明社会"], link: "../明朝皇室族谱/index.html" }, { id: "north-yuan", name: "北元", years: "1368—1388", start: 9, span: 4, kind: "parallel", summary: "元廷退出大都后继续在蒙古高原活动，通常以1388年为北元阶段结束的重要节点。", tags: ["蒙古高原", "元明更替", "草原政权"] }],
            [{ id: "qing", name: "清", years: "1636—1912", span: 9, featured: true, summary: "清建立多民族统一国家，18世纪疆域与制度趋于稳定；19世纪后面临内外危机与现代转型。", tags: ["多民族国家", "康雍乾", "晚清变局"] }, { id: "south-ming", name: "南明", years: "1644—1662", start: 10, span: 3, kind: "parallel", summary: "明亡后，南方多个明朝宗室政权先后延续抗清。", tags: ["明清易代", "弘光", "永历"] }]
          ]
        },
        {
          label: "近现代", years: "1912—今天", rows: [
            [{ id: "roc-mainland", name: "中华民国", years: "大陆时期 1912—1949", span: 12, kind: "transition", summary: "帝制终结后，中国经历共和制度探索、军阀混战、民族战争与国家重建。", tags: ["共和转型", "抗日战争", "社会变革"] }],
            [{ id: "prc", name: "中华人民共和国", years: "1949—", ongoingFrom: 1949, span: 8, featured: true, summary: "1949年中华人民共和国成立，此后中国进入国家建设、改革开放与持续现代化进程。", tags: ["国家建设", "改革开放", "现代化"] }, { id: "roc-taiwan", name: "中华民国", years: "台湾时期 1949—", ongoingFrom: 1949, start: 9, span: 4, kind: "parallel", summary: "1949年后中华民国政府迁台，形成延续至今的两岸分治格局。", tags: ["台湾", "两岸关系", "现代政治"] }]
          ]
        }
      ];

      const durationById = {
        "paleolithic": "约199万年",
        "neolithic": "约8000年",
        "xia": "约470年",
        "shang": "约554年",
        "western-zhou": "275年",
        "spring-autumn": "294年",
        "warring-states": "254年",
        "qin": "14年",
        "western-han": "210年",
        "xin": "14年",
        "eastern-han": "195年",
        "wei": "46年",
        "shu": "42年",
        "wu": "51年",
        "western-jin": "50年",
        "eastern-jin": "103年",
        "sixteen": "135年",
        "liu-song": "59年",
        "southern-qi": "23年",
        "liang": "55年",
        "chen": "32年",
        "northern-wei": "148年",
        "east-west-wei": "23年",
        "qi-zhou": "31年",
        "sui": "37年",
        "tang": "289年",
        "wu-zhou": "15年",
        "five": "53年",
        "ten": "约77年",
        "north-song": "167年",
        "liao": "209年",
        "western-xia": "189年",
        "south-song": "152年",
        "jin": "119年",
        "west-liao": "94年",
        "mongol-yuan": "162年",
        "ming": "276年",
        "north-yuan": "20年",
        "qing": "276年",
        "south-ming": "18年",
        "roc-mainland": "37年"
      };

      function getDuration(item) {
        if (item.ongoingFrom) return `约${new Date().getFullYear() - item.ongoingFrom}年`;
        return durationById[item.id];
      }

      const groupDurationByLabel = {
        "文明起源": "约200万年",
        "夏商周": "约1814年",
        "秦汉": "约440年",
        "魏晋": "约200年",
        "南北朝": "约169年",
        "隋唐": "约326年",
        "五代宋元": "约461年",
        "明清": "约544年"
      };

      function getGroupDuration(group) {
        if (group.label === "近现代") return `约${new Date().getFullYear() - 1912}年`;
        return groupDurationByLabel[group.label];
      }

      const grid = document.getElementById("timeline-grid");
      const dialog = document.getElementById("detail-dialog");
      const detailEra = document.getElementById("detail-era");
      const detailTitle = document.getElementById("detail-title");
      const detailYears = document.getElementById("detail-years");
      const detailSummary = document.getElementById("detail-summary");
      const detailTags = document.getElementById("detail-tags");
      const detailLink = document.getElementById("detail-link");

      function renderTimeline() {
        groups.forEach((group) => {
          const section = document.createElement("section");
          section.className = "era-group";
          section.innerHTML = `<div class="era-label"><strong>${group.label}</strong><span class="era-years">${group.years}</span><span class="era-duration">历时${getGroupDuration(group)}</span></div><div class="era-rows"></div>`;
          const rows = section.querySelector(".era-rows");

          group.rows.forEach((items) => {
            const row = document.createElement("div");
            row.className = "dynasty-row";
            items.forEach((item) => {
              const button = document.createElement("button");
              button.type = "button";
              button.className = "dynasty";
              button.style.setProperty("--start", item.start || 1);
              button.style.setProperty("--span", item.span);
              button.dataset.kind = item.kind || "main";
              if (item.featured) button.dataset.featured = "true";
              const duration = getDuration(item);
              button.innerHTML = `<strong>${item.name}</strong><small>${item.years}</small><em class="duration">历时${duration}</em>`;
              button.setAttribute("aria-label", `${item.name}，${item.years}，历时${duration}，查看详情`);
              button.addEventListener("click", () => openDetail(group, item));
              row.appendChild(button);
            });
            rows.appendChild(row);
          });
          grid.appendChild(section);
        });
      }

      function openDetail(group, item) {
        detailEra.textContent = group.label;
        detailTitle.textContent = item.name;
        detailYears.textContent = `${item.years} · 历时${getDuration(item)}`;
        detailSummary.textContent = item.summary;
        detailTags.replaceChildren(...item.tags.map((tag) => {
          const span = document.createElement("span");
          span.textContent = tag;
          return span;
        }));
        if (item.link) {
          detailLink.href = item.link;
          detailLink.hidden = false;
        } else {
          detailLink.hidden = true;
        }
        dialog.showModal();
      }

      document.getElementById("dialog-close").addEventListener("click", () => dialog.close());
      dialog.addEventListener("click", (event) => {
        const rect = dialog.getBoundingClientRect();
        const outside = event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom;
        if (outside) dialog.close();
      });

      renderTimeline();
    </script>
  </body>
